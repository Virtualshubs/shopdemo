<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Bingo Stream Creator</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
}

.container{
    max-width:1200px;
    margin:auto;
}

.controls{
    text-align:center;
    margin-bottom:20px;
}

select,button,input,textarea{
    padding:10px;
    border-radius:8px;
    border:none;
    margin:5px;
}

button{
    cursor:pointer;
    background:#7c3aed;
    color:white;
}

button:hover{
    opacity:.9;
}

.grid-editor,
.grid-play{
    display:grid;
    gap:8px;
}

.cell-input{
    width:100%;
    min-height:60px;
    resize:none;
    box-sizing:border-box;
}

.bingo-cell{
    min-height:90px;
    background:#222;
    border:2px solid #444;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:10px;
    cursor:pointer;
    transition:.2s;
    user-select:none;
}

.bingo-cell:hover{
    border-color:#7c3aed;
}

.marked{
    background:#22c55e;
    border-color:#4ade80;
}

.url-box{
    width:100%;
    margin-top:15px;
}

.hidden{
    display:none;
}

.topbar{
    text-align:center;
    margin-bottom:20px;
}
</style>
</head>
<body>

<div class="container">

<div id="editor">

<h1>🎮 Bingo Creator</h1>

<div class="controls">
<select id="gridSize">
<option value="4">4 x 4</option>
<option value="5">5 x 5</option>
<option value="6">6 x 6</option>
<option value="9">9 x 9</option>
</select>

<button onclick="generateEditor()">
Generar Cuadrícula
</button>

<button onclick="exportBingo()">
Generar URL
</button>
</div>

<div id="editorGrid" class="grid-editor"></div>

<textarea
id="generatedUrl"
class="url-box"
rows="4"
placeholder="Aquí aparecerá la URL..."
></textarea>

</div>

<div id="player" class="hidden">

<div class="topbar">
<h1>🎯 Bingo</h1>
<button onclick="resetMarks()">Reiniciar</button>
</div>

<div id="playGrid" class="grid-play"></div>

</div>

</div>

<script>

function generateEditor(){

    const size = parseInt(
        document.getElementById('gridSize').value
    );

    const grid =
        document.getElementById('editorGrid');

    grid.innerHTML='';

    grid.style.gridTemplateColumns =
        `repeat(${size},1fr)`;

    for(let i=0;i<size*size;i++){

        const input =
            document.createElement('textarea');

        input.className='cell-input';

        input.placeholder=
            `Casilla ${i+1}`;

        grid.appendChild(input);
    }
}

function exportBingo(){

    const size =
        parseInt(
        document.getElementById('gridSize').value
    );

    const cells =
        [...document.querySelectorAll('.cell-input')]
        .map(el=>el.value.trim());

    const data = {
        size,
        cells
    };

    const encoded =
        btoa(
            encodeURIComponent(
                JSON.stringify(data)
            )
        );

    const url =
        location.origin +
        location.pathname +
        '#' +
        encoded;

    document.getElementById(
        'generatedUrl'
    ).value = url;
}

function loadPlayer(data){

    document.getElementById('editor')
        .classList.add('hidden');

    document.getElementById('player')
        .classList.remove('hidden');

    const grid =
        document.getElementById('playGrid');

    grid.style.gridTemplateColumns =
        `repeat(${data.size},1fr)`;

    data.cells.forEach(text=>{

        const cell =
            document.createElement('div');

        cell.className='bingo-cell';

        cell.textContent =
            text || '—';

        cell.addEventListener(
            'click',
            ()=>cell.classList.toggle('marked')
        );

        grid.appendChild(cell);
    });
}

function resetMarks(){

    document
    .querySelectorAll('.bingo-cell')
    .forEach(cell=>{
        cell.classList.remove('marked');
    });
}

window.addEventListener('load',()=>{

    if(location.hash){

        try{

            const encoded =
                location.hash.substring(1);

            const data =
                JSON.parse(
                    decodeURIComponent(
                        atob(encoded)
                    )
                );

            loadPlayer(data);

        }catch(e){

            console.error(e);

            alert(
                'Error al cargar el bingo'
            );
        }

    }else{

        generateEditor();

    }

});
</script>

</body>
</html>
