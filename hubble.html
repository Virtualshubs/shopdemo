<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Orbital Week Pass Engine + City Ranking</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
  background: #000;
  color: white;
}

canvas { display: block; }

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;
  background: rgba(0,0,0,0.85);
  padding: 12px;
  border-radius: 8px;
  width: 420px;
  max-height: 90vh;
  overflow: auto;
}

button, select, input {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
}

pre {
  white-space: pre-wrap;
  font-size: 12px;
  margin-top: 10px;
}

.highlight {
  border: 1px solid #00ff99;
  padding: 10px;
  margin-top: 10px;
  background: rgba(0,255,150,0.08);
  border-radius: 6px;
}

.rankCard {
  border: 1px solid #444;
  padding: 6px;
  margin-top: 6px;
  font-size: 12px;
  background: rgba(255,255,255,0.05);
}

/* ========================= */
/* MODAL */
/* ========================= */

#modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#modalContent {
  background: #111;
  padding: 20px;
  border-radius: 10px;
  width: 420px;
  border: 1px solid #00ff99;
}

#modalClose {
  margin-top: 10px;
  background: #00ff99;
  border: none;
  cursor: pointer;
  padding: 10px;
  width: 100%;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="ui">
  <h3>🛰 Orbital Pass Engine</h3>

  <select id="satSelect" onchange="changeSatellite()">
    <option value="25544">ISS</option>
    <option value="39634">Sentinel-1A</option>
    <option value="42063">Sentinel-2B</option>
    <option value="25338">NOAA-15</option>
  </select>

  <button onclick="openSatInfo()">ℹ️ Info del satélite</button>

  <select id="citySelect" onchange="changeCity()">
    <option value="40.4168,-3.7038">Madrid</option>
    <option value="41.3874,2.1686">Barcelona</option>
    <option value="39.4699,-0.3763">Valencia</option>
    <option value="37.3891,-5.9845">Sevilla</option>
    <option value="43.2630,-2.9350">Bilbao</option>
    <option value="38.9943,-1.8585">Albacete</option>
    <option value="custom">Custom coords</option>
  </select>

  <input id="lat" placeholder="Latitude" style="display:none">
  <input id="lon" placeholder="Longitude" style="display:none">

  <button onclick="run()">Calcular semana</button>

  <div id="best" class="highlight">Esperando datos...</div>
  <div id="ranking"></div>
  <pre id="out">---</pre>
</div>

<!-- MODAL -->
<div id="modal">
  <div id="modalContent">
    <h3 id="satName"></h3>
    <div id="satInfo"></div>
    <button id="modalClose" onclick="closeModal()">Cerrar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js/dist/satellite.min.js"></script>

<script>

// =========================
// 🌍 SCENE
// =========================
let scene, camera, renderer;

init();

function init() {

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 20000);
  camera.position.set(0, 200, 600);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const earth = new THREE.Mesh(
    new THREE.SphereGeometry(100, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0x2233ff, wireframe: true })
  );

  scene.add(earth);

  const satMesh = new THREE.Mesh(
    new THREE.SphereGeometry(3, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xff4444 })
  );

  scene.add(satMesh);
  window.satMesh = satMesh;

  animate();
}

function animate() {
  requestAnimationFrame(animate);

  if (window.latestSatrec) {
    updateSatellitePosition(window.latestSatrec, new Date());
  }

  renderer.render(scene, camera);
}

// =========================
// OBSERVER
// =========================
function getObserver() {
  return {
    latitude: window.lat || 40.4168,
    longitude: window.lon || -3.7038,
    height: 0.3
  };
}

// =========================
// SAT POSITION
// =========================
function updateSatellitePosition(satrec, date) {

  const pv = satellite.propagate(satrec, date);
  if (!pv.position) return;

  const gmst = satellite.gstime(date);
  const ecf = satellite.eciToEcf(pv.position, gmst);

  const scale = 0.05;

  window.satMesh.position.set(
    ecf.x * scale,
    ecf.z * scale,
    ecf.y * scale
  );
}

// =========================
// ENGINE
// =========================
function scorePass(maxElev, durationMin) {
  return (maxElev * maxElev) * (durationMin / 10);
}

function getClass(maxElev) {
  if (maxElev >= 75) return "🟢 PERFECTO";
  if (maxElev >= 60) return "🟢 EXCELENTE";
  if (maxElev >= 45) return "🟡 MUY BUENO";
  if (maxElev >= 30) return "🟡 BUENO";
  if (maxElev >= 15) return "🟠 DÉBIL";
  return "🔴 MUY BAJO";
}

// =========================
// SAT INFO (ENRIQUECIDO)
// =========================
const SAT_INFO = {
  "25544": {
    name: "ISS",
    type: "Laboratorio orbital tripulado",
    mission: "Ciencia en microgravedad",
    tags: [
      { icon: "🧠", label: "Ciencia" },
      { icon: "🌍", label: "Observación terrestre" },
      { icon: "🔬", label: "Investigación" }
    ],
    data: [
      "Imágenes HD de la Tierra",
      "Experimentos biomédicos",
      "Sensores ambientales",
      "Telemetría orbital"
    ]
  },

  "39634": {
    name: "Sentinel-1A",
    type: "Radar SAR",
    mission: "Copernicus",
    tags: [
      { icon: "🚨", label: "Emergencias" },
      { icon: "🌧", label: "Clima extremo" },
      { icon: "🌍", label: "Superficie terrestre" }
    ],
    data: [
      "Radar SAR",
      "Inundaciones",
      "Deformación del terreno",
      "Hielo y océanos"
    ]
  },

  "42063": {
    name: "Sentinel-2B",
    type: "Multispectral",
    mission: "Observación ambiental",
    tags: [
      { icon: "🌾", label: "Agricultura" },
      { icon: "🌿", label: "Vegetación" },
      { icon: "🏙", label: "Urbanismo" }
    ],
    data: [
      "NDVI",
      "Cobertura vegetal",
      "Uso del suelo",
      "Cambio territorial"
    ]
  },

  "25338": {
    name: "NOAA-15",
    type: "Meteorológico",
    mission: "Clima global",
    tags: [
      { icon: "🌦", label: "Meteorología" },
      { icon: "🌡", label: "Temperatura" },
      { icon: "🌪", label: "Tormentas" }
    ],
    data: [
      "Nubosidad",
      "Temperatura atmósfera",
      "Humedad",
      "Predicción del tiempo"
    ]
  }
};

// =========================
// PASSES
// =========================
function getPasses(satrec, startDate, hours = 168) {

  const observerGd = getObserver();

  const step = 20;
  const passes = [];
  let current = null;

  for (let t = 0; t <= hours * 3600; t += step) {

    const date = new Date(startDate.getTime() + t * 1000);

    const pv = satellite.propagate(satrec, date);
    if (!pv.position) continue;

    const gmst = satellite.gstime(date);
    const ecf = satellite.eciToEcf(pv.position, gmst);

    const look = satellite.ecfToLookAngles(observerGd, ecf);

    const elevDeg = look.elevation * 180 / Math.PI;
    const isVisible = elevDeg > 0;

    if (isVisible && !current) {
      current = { start: date, maxElev: elevDeg, duration: 0 };
    }

    if (current) {
      current.duration += step;

      if (elevDeg > current.maxElev) current.maxElev = elevDeg;

      if (!isVisible) {

        const durMin = current.duration / 60;

        if (current.maxElev < 5) {
          current = null;
          continue;
        }

        const score = scorePass(current.maxElev, durMin);

        passes.push({
          start: current.start,
          end: date,
          maxElev: current.maxElev,
          duration: durMin,
          score,
          class: getClass(current.maxElev)
        });

        current = null;
      }
    }
  }

  return passes;
}

// =========================
// STATE
// =========================
const SATS = {
  "25544": "ISS",
  "39634": "Sentinel-1A",
  "42063": "Sentinel-2B",
  "25338": "NOAA-15"
};

window.currentCATNR = "25544";
window.lat = 40.4168;
window.lon = -3.7038;

// =========================
// SAT + CITY
// =========================
function changeSatellite() {
  const catnr = document.getElementById("satSelect").value;
  loadSatellite(catnr);
}

function changeCity() {
  const val = document.getElementById("citySelect").value;

  if (val === "custom") {
    document.getElementById("lat").style.display = "block";
    document.getElementById("lon").style.display = "block";
    return;
  }

  const [lat, lon] = val.split(",");
  window.lat = parseFloat(lat);
  window.lon = parseFloat(lon);
}

// =========================
// LOAD SAT
// =========================
async function loadSatellite(catnr) {

  const url = `https://celestrak.org/NORAD/elements/gp.php?CATNR=${catnr}&FORMAT=TLE`;

  const res = await fetch(url);
  const text = await res.text();

  const lines = text.trim().split("\n");
  const satrec = satellite.twoline2satrec(lines[1], lines[2]);

  window.latestSatrec = satrec;
  window.currentCATNR = catnr;

  run();
}

// =========================
// MODAL
// =========================
function openSatInfo() {

  const id = window.currentCATNR;
  const info = SAT_INFO[id];

  let tags = "";
  info.tags.forEach(t => {
    tags += `<span style="margin:3px;padding:4px 8px;border:1px solid #00ff99;border-radius:20px;display:inline-block;font-size:12px">${t.icon} ${t.label}</span>`;
  });

  let data = "";
  info.data.forEach(d => {
    data += `<li>${d}</li>`;
  });

  document.getElementById("satName").innerText = info.name;

  document.getElementById("satInfo").innerHTML = `
    <b>Tipo:</b> ${info.type}<br>
    <b>Misión:</b> ${info.mission}<br><br>
    <b>Usabilidad:</b><br>${tags}<br><br>
    <b>📊 Datos:</b><ul>${data}</ul>
  `;

  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

// =========================
// RUN
// =========================
async function run() {

  const out = document.getElementById("out");
  const best = document.getElementById("best");
  const ranking = document.getElementById("ranking");

  if (!window.latestSatrec) {
    best.innerHTML = "Selecciona satélite";
    return;
  }

  const passes = getPasses(window.latestSatrec, new Date(), 168);

  passes.sort((a,b) => b.score - a.score);

  const top = passes[0];

  best.innerHTML = `
  🟢 MEJOR PASO<br>
  Satélite: <b>${SATS[window.currentCATNR]}</b><br>
  Elevación: <b>${top.maxElev.toFixed(1)}°</b><br>
  Score: <b>${Math.round(top.score)}</b><br>
  Inicio: ${top.start}
  `;

  ranking.innerHTML = "";
  passes.slice(0,5).forEach((p,i)=>{
    ranking.innerHTML += `
      <div class="rankCard">
      #${i+1} ${p.class}<br>
      Elev: ${p.maxElev.toFixed(1)}°<br>
      Score: ${Math.round(p.score)}
      </div>
    `;
  });

  out.innerText = passes.map((p,i)=>`
PASS ${i+1} ${p.class}
──────────────────
Inicio: ${p.start}
Fin: ${p.end}
Elev max: ${p.maxElev.toFixed(1)}°
Duración: ${p.duration.toFixed(1)} min
Score: ${Math.round(p.score)}
`).join("\n");
}

</script>

</body>
</html>
