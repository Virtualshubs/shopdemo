<!DOCTYPE html>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background: #000;
  color: #E6F1FF;
}

canvas { display: block; }

/* ========================= */
/* MAIN PANEL (MISSION CONTROL STYLE) */
/* ========================= */

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;

  background: rgba(10, 14, 20, 0.92);
  border: 1px solid rgba(120, 180, 255, 0.15);
  backdrop-filter: blur(10px);

  padding: 14px;
  border-radius: 14px;
  width: 440px;
  max-height: 92vh;
  overflow: auto;

  box-shadow: 0 0 40px rgba(80, 140, 255, 0.08);
}

/* TITLE */
#ui h3 {
  margin: 0 0 10px 0;
  font-weight: 600;
  letter-spacing: 0.08em;
  font-size: 14px;
  color: #9CCBFF;
}

/* CONTROLS */
button, select, input {
  width: 100%;
  padding: 10px;
  margin-top: 8px;

  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(120, 180, 255, 0.12);
  color: #E6F1FF;

  border-radius: 10px;
  outline: none;

  font-size: 12px;
}

button:hover {
  border-color: rgba(120, 180, 255, 0.35);
  cursor: pointer;
}

/* ========================= */
/* MAIN RESULT CARD */
/* ========================= */

.highlight {
  margin-top: 12px;
  padding: 14px;

  border-radius: 14px;

  background: linear-gradient(
    180deg,
    rgba(0, 255, 150, 0.08),
    rgba(0, 120, 255, 0.05)
  );

  border: 1px solid rgba(0, 255, 150, 0.18);

  font-size: 13px;
  line-height: 1.5;
}

/* ========================= */
/* INSIGHT SYSTEM (MISSION MODULES) */
/* ========================= */

.insightBlock {
  margin-top: 10px;
  padding: 10px 12px;

  border-radius: 12px;

  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(120, 180, 255, 0.10);
}

.insightTitle {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #7FB3FF;
  margin-bottom: 6px;
}

.insightItem {
  font-size: 12px;
  opacity: 0.92;
  margin: 2px 0;
  padding-left: 6px;
  border-left: 2px solid rgba(120, 180, 255, 0.25);
}

/* ========================= */
/* RANKING CARDS */
/* ========================= */

.rankCard {
  border: 1px solid rgba(255,255,255,0.08);
  padding: 10px;
  margin-top: 8px;

  font-size: 12px;
  border-radius: 12px;

  background: rgba(255,255,255,0.03);
}

.rankCard:hover {
  border-color: rgba(120, 180, 255, 0.25);
  background: rgba(120, 180, 255, 0.04);
}

/* PRE OUTPUT */
pre {
  white-space: pre-wrap;
  font-size: 11px;
  margin-top: 10px;
  opacity: 0.7;
}
</style>
</head>

<body>

  <option value="custom">📍 Coordenadas personalizadas</option>

</select>

  <input id="lat" placeholder="Latitude" style="display:none">
  <input id="lon" placeholder="Longitude" style="display:none">

  <button onclick="run()">Calcular semana</button>

  <div id="best" class="highlight">Esperando datos...</div>
  <div id="ranking"></div>
  <pre id="out">---</pre>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js/dist/satellite.min.js"></script>


<script>

// =========================
// 🌍 SCENE
// =========================
let scene, camera, renderer;
let earth;

// 🔥 ZOOM SYSTEM
let zoom = 320;
let targetZoom = 320;

init();

function init() {

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    1,
    20000
  );

  camera.position.set(0, 140, zoom);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // =========================
  // 🌍 EARTH
  // =========================
  earth = new THREE.Mesh(
    new THREE.SphereGeometry(100, 32, 32),
    new THREE.MeshBasicMaterial({
      color: 0x2233ff,
      wireframe: true
    })
  );

  scene.add(earth);

  // =========================
  // 🛰 SAT
  // =========================
  const satMesh = new THREE.Mesh(
    new THREE.SphereGeometry(3, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xff4444 })
  );

  scene.add(satMesh);
  window.satMesh = satMesh;

  // =========================
  // 🖱 ZOOM CONTROL
  // =========================
  window.addEventListener("wheel", (e) => {

    targetZoom += e.deltaY * 0.2;

    // límites de zoom
    targetZoom = Math.max(180, Math.min(800, targetZoom));
  });

  animate();

  // =========================
  // 🔥 INIT STATE
  // =========================
  window.lat = 40.4168;
  window.lon = -3.7038;
  window.currentCATNR = "25544";

  const satSelect = document.getElementById("satSelect");
  if (satSelect) satSelect.value = "25544";

  const citySelect = document.getElementById("citySelect");
  if (citySelect) citySelect.value = "40.4168,-3.7038";

  window.currentCityName = "Madrid";

  loadSatellite("25544");
}

function animate() {

  requestAnimationFrame(animate);

  const now = new Date();

  // =========================
  // 🌍 ROTACIÓN TIERRA REAL
  // =========================
  if (earth) {
    const gmst = satellite.gstime(now);
    earth.rotation.y = -gmst;
  }

  // =========================
  // 🛰 SATÉLITE
  // =========================
  if (window.latestSatrec) {
    updateSatellitePosition(window.latestSatrec, now);
  }

  // =========================
  // 🎥 ZOOM SMOOTH
  // =========================
  zoom += (targetZoom - zoom) * 0.1;

  camera.position.set(0, 140, zoom);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}

// =========================
// OBSERVER
// =========================
function getObserver() {
  return {
    latitude: window.lat || 40.4168,
    longitude: window.lon || -3.7038,
    height: 0.3
  };
}

// =========================
// SAT POSITION
// =========================
function updateSatellitePosition(satrec, date) {

  const pv = satellite.propagate(satrec, date);
  if (!pv.position) return;

  const gmst = satellite.gstime(date);
  const ecf = satellite.eciToEcf(pv.position, gmst);

  const scale = 0.05;

  window.satMesh.position.set(
    ecf.x * scale,
    ecf.z * scale,
    ecf.y * scale
  );
}

// =========================
// ENGINE
// =========================
function scorePass(maxElev, durationMin) {
  return (maxElev * maxElev) * (durationMin / 10);
}

function getClass(maxElev) {
  if (maxElev >= 75) return "🟢 PERFECTO";
  if (maxElev >= 60) return "🟢 EXCELENTE";
  if (maxElev >= 45) return "🟡 MUY BUENO";
  if (maxElev >= 30) return "🟡 BUENO";
  if (maxElev >= 15) return "🟠 DÉBIL";
  return "🔴 MUY BAJO";
}

// =========================
// SAT INFO
// =========================
const SAT_INFO = {
  "25544": {
    name: "ISS",
    type: "Estación espacial",
    mission: "Microgravedad",
    instruments: [
      "Laboratorios científicos",
      "Cámaras de observación terrestre",
      "Experimentos biomédicos"
    ],
    capabilities: [
      "Observación humana en órbita",
      "Experimentos en microgravedad",
      "Fotografía terrestre general"
    ]
  },

  "39634": {
    name: "Sentinel-1A",
    type: "Radar SAR",
    mission: "Copernicus (observación radar de la Tierra)",
    instruments: [
      "Radar de apertura sintética (SAR)",
      "Imagen de microondas banda C"
    ],
    capabilities: [
      "Detección de inundaciones",
      "Deformación del terreno",
      "Monitorización de desastres",
      "Funciona de noche y con nubes"
    ]
  },

  "42063": {
    name: "Sentinel-2B",
    type: "Óptico multispectral",
    mission: "Copernicus (observación óptica de la Tierra)",
    instruments: [
      "Cámara multiespectral",
      "13 bandas espectrales"
    ],
    capabilities: [
      "Análisis agrícola",
      "Vegetación y salud de cultivos",
      "Urbanismo y crecimiento urbano",
      "Calidad del agua"
    ]
  },

  "25338": {
    name: "NOAA-15",
    type: "Meteorológico",
    mission: "Clima global y predicción meteorológica",
    instruments: [
      "Radiómetro AVHRR",
      "Sensores atmosféricos",
      "Sondas meteorológicas"
    ],
    capabilities: [
      "Predicción del tiempo",
      "Seguimiento de tormentas",
      "Temperatura global",
      "Cobertura de nubes"
    ]
  }
};

// =========================
// CONTEXT INTELLIGENCE
// =========================
function getContextInsight(satId, maxElev) {

  const info = SAT_INFO[satId];

  let insights = [];

  if (info) {
    insights.push({ title: "MISIÓN", items: [info.mission] });
    insights.push({ title: "TIPO", items: [info.type] });
    insights.push({ title: "INSTRUMENTOS", items: info.instruments });
    insights.push({ title: "CAPACIDADES", items: info.capabilities });
  }

  let cityUse = [];

  if (satId === "39634") cityUse = ["Inundaciones", "Deformación del terreno", "Infraestructura"];
  if (satId === "42063") cityUse = ["Agricultura", "Vegetación", "Uso del suelo"];
  if (satId === "25338") cityUse = ["Clima", "Tormentas", "Nubosidad"];
  if (satId === "25544") cityUse = ["Observación orbital", "Investigación"];

  insights.push({ title: "USO", items: cityUse });

  if (maxElev > 70) insights.push({ title: "CALIDAD", items: ["MUY ALTA 🔥"] });
  else if (maxElev > 45) insights.push({ title: "CALIDAD", items: ["MEDIA 🟡"] });
  else insights.push({ title: "CALIDAD", items: ["BAJA 🟠"] });

  return insights;
}

// =========================
// PASSES
// =========================
function getPasses(satrec, startDate, hours = 168) {

  const observerGd = getObserver();

  const step = 20;
  const passes = [];
  let current = null;

  for (let t = 0; t <= hours * 3600; t += step) {

    const date = new Date(startDate.getTime() + t * 1000);

    const pv = satellite.propagate(satrec, date);
    if (!pv.position) continue;

    const gmst = satellite.gstime(date);
    const ecf = satellite.eciToEcf(pv.position, gmst);

    const look = satellite.ecfToLookAngles(observerGd, ecf);

    const elev = look.elevation * 180 / Math.PI;
    const visible = elev > 0;

    if (visible && !current) {
      current = { start: date, maxElev: elev, duration: 0 };
    }

    if (current) {
      current.duration += step;
      if (elev > current.maxElev) current.maxElev = elev;

      if (!visible) {

        const durMin = current.duration / 60;

        if (current.maxElev < 5) {
          current = null;
          continue;
        }

        passes.push({
          start: current.start,
          end: date,
          maxElev: current.maxElev,
          duration: durMin,
          score: scorePass(current.maxElev, durMin),
          class: getClass(current.maxElev)
        });

        current = null;
      }
    }
  }

  return passes;
}

// =========================
// STATE
// =========================
const SATS = {
  "25544": "ISS",
  "39634": "Sentinel-1A",
  "42063": "Sentinel-2B",
  "25338": "NOAA-15"
};

window.currentCATNR = "25544";
window.lat = 40.4168;
window.lon = -3.7038;

// =========================
// CITY
// =========================
function changeCity() {

  const val = document.getElementById("citySelect").value;

  if (val === "custom") return;

  const [lat, lon] = val.split(",");
  window.lat = parseFloat(lat);
  window.lon = parseFloat(lon);

  window.currentCityName =
    document.getElementById("citySelect")
    .options[document.getElementById("citySelect").selectedIndex]
    .text;
}

// =========================
// SAT
// =========================
function changeSatellite() {
  loadSatellite(document.getElementById("satSelect").value);
}

async function loadSatellite(catnr) {

  const url = `https://celestrak.org/NORAD/elements/gp.php?CATNR=${catnr}&FORMAT=TLE`;

  const res = await fetch(url);
  const text = await res.text();

  const lines = text.trim().split("\n");
  const satrec = satellite.twoline2satrec(lines[1], lines[2]);

  window.latestSatrec = satrec;
  window.currentCATNR = catnr;

  run();
}

// =========================
// RUN
// =========================
async function run() {

  const best = document.getElementById("best");
  const ranking = document.getElementById("ranking");
  const out = document.getElementById("out");

  if (!window.latestSatrec) return;

  const passes = getPasses(window.latestSatrec, new Date(), 168);

  passes.sort((a,b) => b.score - a.score);

  if (!passes.length || passes[0].maxElev < 5) {

    best.innerHTML = `
      🔴 SIN PASOS VISIBLES<br>
      El satélite <b>${SATS[window.currentCATNR]}</b> no cruza este punto.
    `;

    ranking.innerHTML = "";
    out.innerText = "";
    return;
  }

  const top = passes[0];

  const insights = getContextInsight(window.currentCATNR, top.maxElev);

  let insightHTML = "";

  insights.forEach(block => {
    insightHTML += `
      <div class="insightBlock">
        <div class="insightTitle">${block.title}</div>
        ${block.items.map(i => `<div class="insightItem">• ${i}</div>`).join("")}
      </div>
    `;
  });

  best.innerHTML = `
  🟢 MEJOR PASO<br>
  Satélite: <b>${SATS[window.currentCATNR]}</b><br>
  Elevación: <b>${top.maxElev.toFixed(1)}°</b><br>
  Score: <b>${Math.round(top.score)}</b><br>
  Inicio: ${top.start}<br>

  ${insightHTML}
  `;

  ranking.innerHTML = "<b>🏆 TOP 5 PASOS</b>";

  passes.slice(0,5).forEach((p,i)=>{
    ranking.innerHTML += `
      <div class="rankCard">
        #${i+1} ${p.class}<br>
        Elev: ${p.maxElev.toFixed(1)}°<br>
        Score: ${Math.round(p.score)}<br>
      </div>
    `;
  });

  out.innerText = passes.map((p,i)=>`
PASS ${i+1} ${p.class}
──────────────────
Inicio: ${p.start}
Fin: ${p.end}
Elev max: ${p.maxElev.toFixed(1)}°
Duración: ${p.duration.toFixed(1)} min
Score: ${Math.round(p.score)}
`).join("\n");
}

</script>

</body>
</html>
