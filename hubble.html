<!DOCTYPE html>
<html>
<head>
  <title>Hubble Safe Base</title>

  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }

    #btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      padding: 10px;
    }
  </style>
</head>

<body>

<button id="btn">Where is Hubble?</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js/dist/satellite.min.js"></script>

<script>

let scene, camera, renderer;
let earth, hubble;

init();

function init() {

  scene = new THREE.Scene();

  // 🧠 FIX 1: cámara más estable para escala orbital
  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    1,        // 🔴 antes 0.1 (esto causaba inestabilidad)
    20000
  );

  camera.position.z = 600;

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);

  // 🧠 FIX 2: evita artefactos de precisión
  renderer.logarithmicDepthBuffer = true;

  document.body.appendChild(renderer.domElement);

  // 💡 luz estable
  const ambient = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambient);

  const directional = new THREE.DirectionalLight(0xffffff, 1.0);
  directional.position.set(300, 200, 200);
  scene.add(directional);

  // 🌍 TIERRA GLB
  const loader = new THREE.GLTFLoader();

  loader.load(
    "https://demo.3dtwins.eu/tierra.glb",
    (gltf) => {

      earth = gltf.scene;

      // 🧠 FIX 3: normalizar tamaño real del mundo
      const box = new THREE.Box3().setFromObject(earth);
      const size = box.getSize(new THREE.Vector3()).length();

      const scale = 200 / size;

      earth.scale.setScalar(scale);

      // centrar
      const center = box.getCenter(new THREE.Vector3());
      earth.position.sub(center.multiplyScalar(scale));

      scene.add(earth);

      console.log("🌍 Earth loaded stable");
    }
  );

  // 🛰️ HUBBLE
  const hubbleGeo = new THREE.SphereGeometry(6, 16, 16);
  const hubbleMat = new THREE.MeshBasicMaterial({
    color: 0xff3333
  });

  hubble = new THREE.Mesh(hubbleGeo, hubbleMat);
  scene.add(hubble);

  animate();
}

function animate() {
  requestAnimationFrame(animate);

  if (earth) earth.rotation.y += 0.0005;

  renderer.render(scene, camera);
}

// 🚀 BOTÓN
document.getElementById("btn").onclick = async () => {

  const url =
    "https://celestrak.org/NORAD/elements/gp.php?CATNR=20580&FORMAT=TLE";

  const res = await fetch(url);
  const text = await res.text();

  const lines = text.trim().split("\n");

  const satrec = satellite.twoline2satrec(lines[1], lines[2]);

  const now = new Date();
  const pv = satellite.propagate(satrec, now);

  if (!pv.position) return;

  const pos = pv.position;

  // 🧠 FIX 4: escala coherente con mundo normalizado
  const SCALE = 0.5;

  hubble.position.set(
    pos.x * SCALE,
    pos.y * SCALE,
    pos.z * SCALE
  );

  console.log("🛰️ Hubble OK", pos);
};

</script>

</body>
</html>
