<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Landing</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 200vh; /* forzamos scroll */
      background: #0b0f1a;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
    }

    .logo {
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 20px;
    }

    .logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .hint {
      margin-top: 20px;
      opacity: 0.6;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="hero">
    <div class="logo">
    
      <img src="https://demo.3dtwins.eu/ope.png" alt="Logo Orbital Pass Engine" />
    </div>
    <div class="hint">Scroll para continuar</div>
  </div>

  <script>
    let redirected = false;

    window.addEventListener("scroll", () => {
      if (redirected) return;

      const scrollTop = window.scrollY || document.documentElement.scrollTop;

      if (scrollTop > 50) {
        redirected = true;
        window.location.href = "https://demo.3dtwins.eu/hubble.html";
      }
    });
  </script>

</body>
</html>
