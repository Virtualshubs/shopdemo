<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Twins Lite</title>

<style>/* ================= BASE ================= */

body {
  margin: 0;
  overflow: hidden;
  font-family: Inter, Arial, sans-serif;
  background: #000;
}

canvas {
  display: block;
}

input {
  box-sizing: border-box;
}

/* ================= LOADING STATE ================= */

.loading-scene #ui {
  display: none !important;
}

.loading-scene body {
  background: #000 !important;
}

/* ================= UI BASE (TOOL MODE) ================= */

#ui {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 10;

  width: 340px;
  padding: 16px;

  background: rgba(20, 22, 28, 0.72);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;

  color: #fff;
}

/* ================= FULLSCREEN MODE (STEP 1) ================= */

#ui.ui-fullscreen {
  position: absolute;
  inset: 0;
  padding-left: 24px;
  padding-right: 24px;
  width: 100%;
  height: 100%;

  border-radius: 0;

  display: flex;
  align-items: flex-start;
  justify-content: center;

  padding-top: 12vh;

  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(20px);
}

/* ocultar navegación en hero */
#ui.ui-fullscreen .stepNav,
#ui.ui-fullscreen .stepDot {
  display: none;
}

#ui.ui-fullscreen #step2,
#ui.ui-fullscreen #step3 {
  display: none;
}

/* STEP 1 layout */
.step-hero {
  width: 100%;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 18px;
  margin-top: 6vh;
   min-height: 100vh;
    justify-content: center;
}

/* ================= HERO TEXT ================= */

.heroTitle {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin: 20px;
}

.heroSubtitle {
  font-size: 13px;
  opacity: 0.6;
  max-width: 420px;
  line-height: 1.5;
  text-align: center;  
  margin: 0 auto;  
}
  
/* ================= HERO INPUT CARD ================= */

.heroInputBox {
  width: 100%;
  max-width: 520px;
  padding: 18px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  backdrop-filter: blur(12px);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.heroInputBox{
  width: 100%;
  max-width: 520px;
  margin: 0 auto;   
  padding: 18px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  backdrop-filter: blur(12px);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.heroHint {
  font-size: 11px;
  opacity: 0.4;
}

/* ================= GLOBAL INPUT (TOOL MODE ONLY) ================= */

input:not(.heroInputBox input) {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.05);
  color: white;
  outline: none;
  margin-bottom: 8px;
}

/* ================= TITLE ================= */

#title {
  font-size: 14px;
  font-weight: 400;
  margin-bottom: 8px;
  letter-spacing: 0.3px;
  opacity: 0.9;
}

.titleGif{
  width:min(400px, 80vw);
  height:auto;
  display:block;
  margin:0 auto 14px auto;
  opacity:.9;
}

/* suave flotación */
@keyframes titleFloat {
  0% {
    transform: translateY(0px);
    opacity: 0.85;
  }

  50% {
    transform: translateY(-2px);
    opacity: 1;
  }

  100% {
    transform: translateY(0px);
    opacity: 0.85;
  }
}

/* ================= BUTTONS ================= */

.btn {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-weight: 600;
  cursor: pointer;
}

.btn-primary {
  background: #4da3ff;
  color: #000;
}

.btn-secondary {
  background: rgba(255,255,255,0.06);
  color: #fff;
}

/* ================= COLOR PICKER ================= */

.settingGroup {
  margin-top: 14px;
  padding: 14px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 12px;
  backdrop-filter: blur(8px);
}

.settingGroup:first-child {
  margin-top: 0;
}

.settingGroup .label {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.55;
  margin-bottom: 10px;
}

/* palette */
#colorPalette {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.color-swatch {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  cursor: pointer;

  border: 2px solid rgba(255,255,255,0.15);

  transition: transform 0.15s ease, border 0.15s ease, box-shadow 0.15s ease;
}

.color-swatch:hover {
  transform: scale(1.15);
  border-color: rgba(255,255,255,0.7);
}

.color-swatch.active {
  border-color: white;
  box-shadow: 0 0 0 3px rgba(255,255,255,0.15);
}

/* color wheel */
#colorWheel {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: conic-gradient(
    red,
    yellow,
    lime,
    cyan,
    blue,
    magenta,
    red
  );

  cursor: pointer;

  border: 2px solid rgba(255,255,255,0.15);

  transition: transform 0.15s ease, border 0.15s ease;
}

#colorWheel:hover {
  transform: scale(1.15);
  border-color: rgba(255,255,255,0.7);
}

/* hidden color input */
#bgInput {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

/* ================= LINK BOX ================= */

#linkBox {
  margin-top: 12px;
  padding: 10px;
  font-size: 11px;
  word-break: break-all;
  background: rgba(0,0,0,0.25);
  border-radius: 10px;
  color: rgba(255,255,255,0.65);
}

/* ================= STEPS ================= */

.step {
  display: none;
}

.step.active {
  display: block;
}

/* ================= NAV ================= */

.stepNav {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
}

.stepDot {
  flex: 1;
  height: 4px;
  border-radius: 20px;
  background: rgba(255,255,255,0.1);
}

.stepDot.active {
  background: #4da3ff;
}

  #watermark{
  position:fixed;
  bottom:16px;
  right:16px;

  font-size:11px;
  color:rgba(255,255,255,.45);

  padding:8px 12px;

  background:rgba(0,0,0,.25);
  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;

  z-index:5;

  transition:.2s ease;
}

#watermark:hover{
  color:white;
  transform:translateY(-2px);
}

  /* ===================================================== */
/* ================= RESPONSIVE TABLET ================= */
/* ===================================================== */

@media (max-width: 1024px) {

  #ui:not(.ui-fullscreen){
    width:300px;
    top:16px;
    left:16px;
  }

  .heroTitle{
    font-size:30px;
  }

  .heroSubtitle{
    max-width:480px;
  }

  .titleGif{
    width:320px;
    height:320px;
  }

}


/* ===================================================== */
/* =============== RESPONSIVE MOBILE LARGE ============= */
/* ===================================================== */

@media (max-width: 768px) {

  #ui:not(.ui-fullscreen){
    width:calc(100% - 32px);
    left:16px;
    top:16px;
    padding:14px;
  }

  #ui.ui-fullscreen{
    padding-left:20px;
    padding-right:20px;
  }

  .step-hero{
    max-width:100%;
    gap:16px;
  }

  .heroTitle{
    font-size:28px;
    line-height:1.1;
  }

  .heroSubtitle{
    font-size:13px;
    max-width:100%;
  }

  .heroInputBox{
    max-width:100%;
    padding:16px;
  }

  .titleGif{
    width:260px;
    height:260px;
  }

  #colorPalette{
    gap:8px;
  }

  .color-swatch{
    width:24px;
    height:24px;
  }

  .stepNav{
    gap:6px;
  }

  #watermark{
    right:12px;
    bottom:12px;
  }

}


/* ===================================================== */
/* =============== RESPONSIVE MOBILE SMALL ============= */
/* ===================================================== */

@media (max-width: 480px) {

  #ui:not(.ui-fullscreen){
    width:calc(100% - 20px);
    left:10px;
    top:10px;
    padding:12px;
  }

  #ui.ui-fullscreen{
    padding-left:14px;
    padding-right:14px;
    padding-top:4vh;
  }

  .step-hero{
    gap:14px;
    margin-top:0;
  }

  .heroTitle{
    font-size:24px;
    line-height:1.1;
  }

  .heroSubtitle{
    font-size:12px;
    line-height:1.5;
    max-width:100%;
  }

  .heroInputBox{
    padding:14px;
  }

  .heroInputBox input{
    font-size:12px;
    padding:12px;
  }

  .titleGif{
    width:180px;
    height:180px;
  }

  .btn{
    padding:11px;
    font-size:13px;
  }

  .settingGroup{
    padding:12px;
  }

  #colorPalette{
    gap:6px;
  }

  .color-swatch{
    width:22px;
    height:22px;
  }

  #colorWheel{
    width:26px;
    height:26px;
  }

  #watermark{
    font-size:10px;
    padding:6px 10px;
    right:8px;
    bottom:8px;
  }

}
</style>
    <script>
if (new URLSearchParams(location.search).get("scene")) {
  document.documentElement.classList.add("loading-scene");
}
</script>
</head>

<body>

<div id="ui">

  <div class="stepNav">
    <div class="stepDot active" id="dot1"></div>
    <div class="stepDot" id="dot2"></div>
    <div class="stepDot" id="dot3"></div>
  </div>

<div id="step1" class="step active step-hero">
  
<div id="title">
  3D Twins Lite
</div>

<img class="titleGif" src="https://demo.3dtwins.eu/leopard3dtwinslittle.gif" alt="fun" />


  
  <div class="heroTitle">
    Create your 3D scene
  </div>

  <div class="heroSubtitle">
    Paste a GLB model URL to start building your interactive experience
  </div>

  <div class="heroInputBox">

    <input id="urlInput" placeholder="https://yoururl.com" />

    <button class="btn btn-primary" onclick="goStep(2)">
      Load model
    </button>

  </div>

  <div class="heroHint">
    Supports GLB / GLTF files hosted online
  </div>

</div>

<div id="step2" class="step">

  <div class="settingGroup">

    <div class="label">Background color</div>

    <div class="colorPickerRow">
      <div id="colorWheel" onclick="bgInput.click()"></div>

      <div id="colorPalette">
        <div class="color-swatch" data-color="#0e0f13" style="background:#0e0f13"></div>
        <div class="color-swatch" data-color="#c2ceff" style="background:#c2ceff"></div>
        <div class="color-swatch" data-color="#ffffff" style="background:#ffffff"></div>
        <div class="color-swatch" data-color="#1a1a1a" style="background:#1a1a1a"></div>
        <div class="color-swatch" data-color="#4da3ff" style="background:#4da3ff"></div>
        <div class="color-swatch" data-color="#ff6b6b" style="background:#ff6b6b"></div>
      </div>
    </div>

    <input id="bgInput" type="color" style="display:none;" />

  </div>

  <div class="settingGroup">

    <div class="label">Auto rotate</div>

    <label style="display:flex;align-items:center;gap:8px;font-size:12px;">
      <input id="rotateInput" type="checkbox">
      Enable rotation
    </label>

  </div>

  <div class="stepNav">
    <button class="btn btn-secondary" onclick="goStep(1)">Back</button>
    <button class="btn btn-secondary" onclick="goStep(3)">Continue</button>
  </div>

</div>

  
  <div id="step3" class="step">

  <button class="btn btn-primary" onclick="exportScene()">
    Publish Scene
  </button>

  <div class="label">Share link</div>
  <div id="linkBox">No scene generated yet</div>

  <!-- NEW ACTIONS -->
  <div id="exportActions" style="display:none; margin-top:12px; gap:8px; display:flex; flex-direction:column;">

    <button class="btn btn-secondary" onclick="openScene()">
      Go to scene
    </button>

    <button class="btn btn-secondary" onclick="copyURL()">
      Copy URL
    </button>

    <button class="btn btn-secondary" onclick="generateQR()">
      Generate QR
    </button>

  </div>

  <div class="stepNav">
    <button class="btn btn-secondary" onclick="goStep(2)">Back</button>
  </div>

</div>

</div>

<canvas id="c"></canvas>
  
  <a id="watermark"
   href="https://tudominio.com/3dtwinslite"
   target="_blank">
   Made with 3D Twins Lite
</a>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

let scene, camera, renderer, controls, model;

let state = {
  modelUrl: null,
  bg: "#000000",
  autoRotate: false
};

let lastGeneratedURL = null;
let isLoadingFromURL = false;

init();
checkURL();
animate();

/* ================= INIT ================= */

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(state.bg);

  camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
  camera.position.set(2, 2, 3);

  renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("c"),
    antialias: true
  });

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = state.autoRotate;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1));

  const d = new THREE.DirectionalLight(0xffffff, 0.8);
  d.position.set(5, 10, 5);
  scene.add(d);

  window.addEventListener("resize", onResize);

  /* ================= UI EVENTS ================= */

  const rotateInput = document.getElementById("rotateInput");
  if (rotateInput) {
    rotateInput.checked = state.autoRotate;
    rotateInput.addEventListener("change", (e) => {
      applyRotation(e.target.checked);
    });
  }

  const bgInput = document.getElementById("bgInput");

  if (bgInput) {
    bgInput.addEventListener("input", (e) => {
      const color = e.target.value;
      applySceneStyle(color);

      document
        .querySelectorAll(".color-swatch")
        .forEach(s => s.classList.remove("active"));

      document
        .querySelector(`.color-swatch[data-color="${color}"]`)
        ?.classList.add("active");
    });
  }

  document.querySelectorAll(".color-swatch").forEach((swatch) => {
    swatch.addEventListener("click", () => {
      const color = swatch.dataset.color;

      bgInput.value = color;
      applySceneStyle(color);

      document
        .querySelectorAll(".color-swatch")
        .forEach(s => s.classList.remove("active"));

      swatch.classList.add("active");
    });
  });

  document.getElementById("colorWheel")?.addEventListener("click", () => {
    bgInput.click();
  });

  const actions = document.getElementById("exportActions");
  if (actions) actions.style.display = "none";

  /* ================= START MODE (FULLSCREEN STEP 1) ================= */
  document.getElementById("ui")?.classList.add("ui-fullscreen");
}

/* ================= UI MODE SWITCH ================= */

function setCompactUI() {
  document.getElementById("ui")?.classList.remove("ui-fullscreen");
}

/* ================= MODEL ================= */

function loadModel(url) {
  const loader = new THREE.GLTFLoader();

  if (model) scene.remove(model);

  loader.load(url, (gltf) => {
    model = gltf.scene;
    scene.add(model);

    const box = new THREE.Box3().setFromObject(model);
    model.position.sub(box.getCenter(new THREE.Vector3()));

    /* 🔥 SWITCH UI MODE HERE */
    setCompactUI();

    /* opcional: avanzar paso */
    goStep(2);
  });
}

/* ================= STEPS ================= */

function goStep(step) {

  document.querySelectorAll(".step").forEach(s =>
    s.classList.remove("active")
  );
  document.getElementById("step" + step).classList.add("active");

  document.querySelectorAll(".stepDot").forEach(d =>
    d.classList.remove("active")
  );
  document.getElementById("dot" + step).classList.add("active");

  if (step === 2) {
    const url = urlInput.value.trim();
    if (url && !state.modelUrl) {
      state.modelUrl = url;
      loadModel(url);
    }
  }

  if (step === 3) {
    applyRotation(document.getElementById("rotateInput").checked);
  }
}

/* ================= STYLE ================= */

function applySceneStyle(bg) {
  state.bg = bg;
  scene.background = new THREE.Color(bg);
  document.body.style.background = bg;
}

/* ================= ROTATION ================= */

function applyRotation(value) {
  state.autoRotate = value;

  if (controls) {
    controls.autoRotate = value;
  }

  const rotateInput = document.getElementById("rotateInput");
  if (rotateInput) rotateInput.checked = value;
}

/* ================= EXPORT ================= */

function exportScene() {
  const url = state.modelUrl || urlInput.value.trim();

  const payload = {
    modelUrl: url,
    bg: bgInput.value,
    autoRotate: state.autoRotate
  };

  const encoded = btoa(JSON.stringify(payload));
  const link = `${location.origin}${location.pathname}?scene=${encoded}`;

  lastGeneratedURL = link;

  linkBox.innerHTML = link;

  const actions = document.getElementById("exportActions");
  if (actions) actions.style.display = "flex";
}

/* ================= ACTIONS ================= */

function openScene() {
  if (!lastGeneratedURL) return;
  window.open(lastGeneratedURL, "_blank", "noopener,noreferrer");
}

function copyURL() {
  if (!lastGeneratedURL) return;

  navigator.clipboard.writeText(lastGeneratedURL)
    .then(() => alert("URL copied"))
    .catch(() => {
      const temp = document.createElement("textarea");
      temp.value = lastGeneratedURL;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      temp.remove();
    });
}

function generateQR() {
  if (!lastGeneratedURL) return;

  const win = window.open("", "_blank");

  win.document.write(`
    <html>
      <body style="display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(lastGeneratedURL)}" />
      </body>
    </html>
  `);
}

/* ================= URL LOAD ================= */

function checkURL() {
  const sceneParam = new URLSearchParams(location.search).get("scene");
  if (!sceneParam) return;

  isLoadingFromURL = true;

  try {
    const data = JSON.parse(atob(sceneParam));

    document.getElementById("ui").style.display = "none";

    if (data.modelUrl) loadModel(data.modelUrl);

    applySceneStyle(data.bg || state.bg);
    applyRotation(data.autoRotate ?? false);

    lastGeneratedURL = window.location.href;

  } catch (e) {
    console.error(e);
  }

  requestAnimationFrame(() => {
    isLoadingFromURL = false;
  });
}

/* ================= LOOP ================= */

function animate() {
  requestAnimationFrame(animate);

  if (isLoadingFromURL) return;

  if (controls) controls.update();
  renderer.render(scene, camera);
}

/* ================= RESIZE ================= */

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

</script>

</body>
</html>
