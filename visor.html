<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>3D Twins Lite</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Inter, Arial, sans-serif;
    background: #0e0f13;
  }

  /* CANVAS */
  canvas {
    display: block;
  }

  /* UI PANEL */
  #ui {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;

    width: 340px;
    padding: 16px;

    background: rgba(20, 22, 28, 0.72);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;

    color: #fff;
  }

  #title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    opacity: 0.9;
  }

  input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;

    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.05);

    color: white;
    outline: none;
  }

  input::placeholder {
    color: rgba(255,255,255,0.4);
  }

  .btn {
    width: 100%;
    margin-top: 10px;
    padding: 12px;

    border-radius: 10px;
    border: none;

    font-weight: 600;
    cursor: pointer;

    transition: 0.2s;
  }

  .btn-primary {
    background: #4da3ff;
    color: #000;
  }

  .btn-primary:hover {
    background: #6bb5ff;
  }

  .btn-secondary {
    background: rgba(255,255,255,0.06);
    color: white;
    border: 1px solid rgba(255,255,255,0.08);
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.1);
  }

  /* LINK BOX */
  #linkBox {
    margin-top: 12px;
    padding: 10px;

    font-size: 11px;
    line-height: 1.4;

    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;

    word-break: break-all;
    color: rgba(255,255,255,0.65);
  }

  .label {
    font-size: 11px;
    opacity: 0.5;
    margin-top: 10px;
  }
</style>
</head>

<body>

<div id="ui">
  <div id="title">3D Twins Lite · Scene Viewer</div>

  <input id="urlInput" placeholder="Paste GLB URL..." />

  <button class="btn btn-secondary" onclick="loadFromInput()">
    Load Model
  </button>

  <button class="btn btn-primary" onclick="exportScene()">
    Publish Scene
  </button>

  <div class="label">Share link</div>
  <div id="linkBox">No scene generated yet</div>
</div>

<canvas id="c"></canvas>

<!-- THREE r134 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
let scene, camera, renderer, controls, model;
let isInitialized = false;

init();
animate();
checkURL();

/* INIT */
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#0e0f13");

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(2, 2, 3);

  renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("c"),
    antialias: true
  });

  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.2;

  const light1 = new THREE.HemisphereLight(0xffffff, 0x222233, 1);
  scene.add(light1);

  const light2 = new THREE.DirectionalLight(0xffffff, 0.8);
  light2.position.set(5, 10, 5);
  scene.add(light2);

  window.addEventListener("resize", onResize);

  isInitialized = true;
}

/* LOAD */
function loadModel(url) {
  if (!isInitialized) return;

  const loader = new THREE.GLTFLoader();

  if (model) {
    scene.remove(model);
    model = null;
  }

  loader.load(url, (gltf) => {
    model = gltf.scene;
    scene.add(model);

    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
  });
}

/* INPUT */
function loadFromInput() {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) return;
  loadModel(url);
}

/* EXPORT */
function exportScene() {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) return;

  const payload = { modelUrl: url };
  const encoded = btoa(JSON.stringify(payload));

  const link =
    `${window.location.origin}${window.location.pathname}?scene=${encoded}`;

  document.getElementById("linkBox").innerHTML = link;

  window.open(link, "_blank", "noopener,noreferrer");
}

/* URL */
function checkURL() {
  const params = new URLSearchParams(window.location.search);
  const scene = params.get("scene");

  if (scene) {
    try {
      const decoded = JSON.parse(atob(scene));
      if (decoded?.modelUrl) {
        document.getElementById("ui").style.display = "none";
        loadModel(decoded.modelUrl);
      }
    } catch (e) {}
  }
}

/* LOOP */
function animate() {
  requestAnimationFrame(animate);
  if (controls) controls.update();
  renderer.render(scene, camera);
}

/* RESIZE */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>

</body>
</html>
