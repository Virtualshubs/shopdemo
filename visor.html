<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>3D Twins Lite</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Inter, Arial, sans-serif;
    background: #c2ceff;
  }

  canvas { display: block; }

  /* =========================
     SIDEBAR
  ========================== */

  #sidebar {
    position: absolute;
    left: 0;
    top: 0;
    width: 64px;
    height: 100vh;
    z-index: 20;

    background: rgba(15, 18, 25, 0.92);
    backdrop-filter: blur(14px);

    border-right: 1px solid rgba(255,255,255,0.06);

    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 14px;
    gap: 10px;
  }

  .navBtn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: none;

    cursor: pointer;

    background: rgba(255,255,255,0.05);
    color: white;

    font-size: 18px;

    transition: 0.2s;
  }

  .navBtn:hover {
    background: rgba(255,255,255,0.12);
  }

  .navBtn.active {
    background: #4da3ff;
    color: black;
  }

  /* =========================
     PANEL
  ========================== */

  #panel {
    position: absolute;
    left: 64px;
    top: 0;
    width: 320px;
    height: 100vh;

    z-index: 19;

    background: rgba(20, 22, 28, 0.72);
    backdrop-filter: blur(12px);

    border-right: 1px solid rgba(255,255,255,0.08);

    padding: 16px;
    box-sizing: border-box;

    color: white;
  }

  #title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;

    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.05);

    color: white;
    outline: none;
    margin-bottom: 8px;
  }

  .btn {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-primary { background: #4da3ff; color: #000; }
  .btn-secondary { background: rgba(255,255,255,0.06); color: #fff; }

  #linkBox {
    margin-top: 12px;
    padding: 10px;
    font-size: 11px;
    word-break: break-all;

    background: rgba(0,0,0,0.25);
    border-radius: 10px;

    color: rgba(255,255,255,0.65);
  }

  .label {
    font-size: 11px;
    opacity: 0.5;
    margin-top: 10px;
  }

  .checkRow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    opacity: 0.85;
  }

  .section {
    display: none;
  }

  .section.active {
    display: block;
  }
</style>
</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar">

  <button class="navBtn active" onclick="showPanel('model')">
    📦
  </button>

  <button class="navBtn" onclick="showPanel('style')">
    🎨
  </button>

  <button class="navBtn" onclick="showPanel('publish')">
    🔗
  </button>

</div>

<!-- PANEL -->
<div id="panel">

  <div id="title">3D Twins Lite</div>

  <!-- MODEL -->
  <div id="model" class="section active">

    <input id="urlInput" placeholder="Paste GLB URL..." />

    <button class="btn btn-secondary" onclick="loadFromInput()">
      Load Model
    </button>

  </div>

  <!-- STYLE -->
  <div id="style" class="section">

    <div class="label">Background color</div>
    <input id="bgInput" type="color" value="#0e0f13" />

    <div class="label">Opacity</div>
    <input id="opacityInput" type="range" min="0" max="1" step="0.05" value="1" />

    <div class="label">Auto rotate</div>

    <label class="checkRow">
      <input id="rotateInput" type="checkbox" checked />
      Enable rotation
    </label>

  </div>

  <!-- PUBLISH -->
  <div id="publish" class="section">

    <button class="btn btn-primary" onclick="exportScene()">
      Publish Scene
    </button>

    <div class="label">Share link</div>
    <div id="linkBox">No scene generated yet</div>

  </div>

</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

let scene, camera, renderer, controls, model;
let isInitialized = false;

init();
animate();
checkURL();

/* INIT */
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#c2ceff");

  camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(2, 2, 3);

  renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("c"),
    antialias: true
  });

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setClearAlpha(1);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.2;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1));

  const d = new THREE.DirectionalLight(0xffffff, 0.8);
  d.position.set(5,10,5);
  scene.add(d);

  window.addEventListener("resize", onResize);

  isInitialized = true;
}

/* LOAD MODEL */
function loadModel(url) {
  const loader = new THREE.GLTFLoader();

  if (model) scene.remove(model);

  loader.load(url, (gltf) => {
    model = gltf.scene;
    scene.add(model);

    const box = new THREE.Box3().setFromObject(model);
    model.position.sub(box.getCenter(new THREE.Vector3()));
  });
}

/* INPUT */
function loadFromInput() {
  const url = urlInput.value.trim();
  if (!url) return;
  loadModel(url);
}

/* APPLY STYLE */
function applySceneStyle(bg, opacity) {
  if (bg) {
    scene.background = new THREE.Color(bg);
    document.body.style.background = bg;
  }

  if (opacity !== undefined) {
    renderer.setClearAlpha(opacity);
  }
}

/* APPLY ROTATION (NEW ONLY) */
function applyRotation(value) {
  if (!controls) return;
  controls.autoRotate = value;
}

/* EXPORT */
function exportScene() {
  const url = urlInput.value.trim();
  if (!url) return;

  const bg = bgInput.value;
  const opacity = parseFloat(opacityInput.value);
  const rotate = rotateInput.checked;

  const payload = {
    modelUrl: url,
    bg,
    opacity,
    autoRotate: rotate
  };

  const encoded = btoa(JSON.stringify(payload));

  const link =
    `${location.origin}${location.pathname}?scene=${encoded}`;

  linkBox.innerHTML = link;

  window.open(link, "_blank", "noopener,noreferrer");
}

/* URL LOADER */
function checkURL() {
  const sceneParam = new URLSearchParams(location.search).get("scene");
  if (!sceneParam) return;

  try {
    const data = JSON.parse(atob(sceneParam));

    if (data.modelUrl) {
      document.getElementById("ui").style.display = "none";
      loadModel(data.modelUrl);

      applySceneStyle(data.bg, data.opacity);
      applyRotation(data.autoRotate ?? true);
      rotateInput.checked = data.autoRotate ?? true;
    }

  } catch (e) {
    console.error(e);
  }
}

/* LIVE UI */
bgInput.addEventListener("input", e => {
  scene.background = new THREE.Color(e.target.value);
  document.body.style.background = e.target.value;
});

opacityInput.addEventListener("input", e => {
  renderer.setClearAlpha(parseFloat(e.target.value));
});

rotateInput.addEventListener("change", e => {
  controls.autoRotate = e.target.checked;
});

/* LOOP */
function animate() {
  requestAnimationFrame(animate);
  if (controls) controls.update();
  renderer.render(scene, camera);
}

/* RESIZE */
function onResize() {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
function showPanel(section){

  document.querySelectorAll(".section")
    .forEach(s => s.classList.remove("active"));

  document.getElementById(section).classList.add("active");

  document.querySelectorAll(".navBtn")
    .forEach(b => b.classList.remove("active"));

  event.target.classList.add("active");
}
</script>

</body>
</html>
