<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>3D Twins Lite MVP</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111;
  }

  #ui {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    background: rgba(0,0,0,0.65);
    padding: 14px;
    border-radius: 10px;
    width: 320px;
    color: white;
  }

  input {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border-radius: 6px;
    border: none;
  }

  button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #00c2ff;
    color: black;
    font-weight: bold;
    cursor: pointer;
  }

  #linkBox {
    margin-top: 10px;
    font-size: 12px;
    word-break: break-all;
    color: #aaa;
  }

  canvas {
    display: block;
  }
</style>
</head>

<body>

<div id="ui">
  <b>3D Twins Lite (r134)</b>

  <input id="urlInput" placeholder="Paste GLB URL..." />

  <button onclick="loadFromInput()">Load Model</button>
  <button onclick="exportScene()">Export Scene Link</button>

  <div id="linkBox"></div>
</div>

<canvas id="c"></canvas>

<!-- THREE r134 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
let scene, camera, renderer, controls, model;
let isInitialized = false;

init();
animate();
checkURL();

/* ---------------- INIT ---------------- */
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#eaeaea");

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(2, 2, 3);

  renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("c"),
    antialias: true
  });

  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.2;

  const light1 = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
  scene.add(light1);

  const light2 = new THREE.DirectionalLight(0xffffff, 1);
  light2.position.set(5, 10, 5);
  scene.add(light2);

  window.addEventListener("resize", onResize);

  isInitialized = true;
}

/* ---------------- MODEL ---------------- */
function loadModel(url) {
  if (!isInitialized) return;

  const loader = new THREE.GLTFLoader();

  if (model) {
    scene.remove(model);
    model = null;
  }

  loader.load(
    url,
    (gltf) => {
      model = gltf.scene;
      scene.add(model);

      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);
    },
    undefined,
    (err) => console.error(err)
  );
}

/* ---------------- INPUT ---------------- */
function loadFromInput() {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) return;

  loadModel(url);
}

/* ---------------- EXPORT (scene standard) ---------------- */
function exportScene() {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) return;

  const payload = {
    modelUrl: url
  };

  const encoded = btoa(JSON.stringify(payload));

  const link =
    `${window.location.origin}${window.location.pathname}?scene=${encoded}`;

  document.getElementById("linkBox").innerHTML =
    "Scene link:<br>" + link;

  history.pushState({}, "", link);
}

/* ---------------- URL RESOLVER ---------------- */
function checkURL() {
  const params = new URLSearchParams(window.location.search);

  const scene = params.get("scene");

  if (scene) {
    try {
      const decoded = JSON.parse(atob(scene));

      const url = decoded.modelUrl;

      if (url) {
        document.getElementById("ui").style.display = "none";
        loadModel(url);
      }
    } catch (e) {
      console.error("Invalid scene payload", e);
    }
    return;
  }

  // LEGACY SUPPORT
  let src = params.get("src");

  if (src) {
    src = decodeURIComponent(src);
    document.getElementById("ui").style.display = "none";
    loadModel(src);
  }
}

/* ---------------- RENDER LOOP ---------------- */
function animate() {
  requestAnimationFrame(animate);
  if (controls) controls.update();
  if (renderer && scene && camera) {
    renderer.render(scene, camera);
  }
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>

</body>
</html>
