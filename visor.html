<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Twins Lite Viewer</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      overflow: hidden;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      padding: 15px;
      border-radius: 10px;
      width: 320px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: none;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #00c2ff;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    #viewer {
      width: 100vw;
      height: 100vh;
    }

    #linkBox {
      margin-top: 10px;
      font-size: 12px;
      word-break: break-all;
      color: #aaa;
    }
  </style>
</head>
<body>

<div id="ui">
  <div><b>3D Twins Lite</b></div>

  <input id="urlInput" placeholder="Paste GLB URL..." />

  <button onclick="createScene()">Create Scene</button>

  <div id="linkBox"></div>
</div>

<canvas id="viewer"></canvas>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
let scene, camera, renderer, controls, model;

init();
checkURL();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#eaeaea");

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(2, 2, 3);

  renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("viewer"),
    antialias: true
  });

  renderer.setSize(window.innerWidth, window.innerHeight);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.2;

  const light1 = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
  scene.add(light1);

  const light2 = new THREE.DirectionalLight(0xffffff, 1);
  light2.position.set(5, 10, 5);
  scene.add(light2);

  animate();
}

function loadModel(url) {
  const loader = new THREE.GLTFLoader();

  if (model) scene.remove(model);

  loader.load(url, (gltf) => {
    model = gltf.scene;
    scene.add(model);

    // center model
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
  });
}

function createScene() {
  const url = document.getElementById("urlInput").value;

  if (!url) return;

  loadModel(url);

  const shareURL = `${window.location.origin}${window.location.pathname}?src=${encodeURIComponent(url)}`;

  document.getElementById("linkBox").innerHTML = `
    Share link:<br>${shareURL}
  `;

  history.pushState({}, "", shareURL);
}

function checkURL() {
  const params = new URLSearchParams(window.location.search);
  const src = params.get("src");

  if (src) {
    document.getElementById("ui").style.display = "none";
    loadModel(src);
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
