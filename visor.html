<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>3D Twins Lite</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Inter, Arial, sans-serif;
    background: #c2ceff;
  }

  canvas { display: block; }

  #ui {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;

    width: 340px;
    padding: 16px;

    background: rgba(20, 22, 28, 0.72);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;

    color: #fff;
  }

  #title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
  }

  input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.05);
    color: white;
    outline: none;
    margin-bottom: 8px;
  }

  .btn {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-primary { background: #4da3ff; color: #000; }
  .btn-secondary { background: rgba(255,255,255,0.06); color: #fff; }

  #linkBox {
    margin-top: 12px;
    padding: 10px;
    font-size: 11px;
    word-break: break-all;
    background: rgba(0,0,0,0.25);
    border-radius: 10px;
    color: rgba(255,255,255,0.65);
  }

  #qrBox {
    margin-top: 10px;
    text-align: center;
  }

  .step {
    display: none;
  }

  .step.active {
    display: block;
  }

  .navRow {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .navBtn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: rgba(255,255,255,0.08);
    color: white;
  }
</style>
</head>

<body>

<div id="ui">

  <div id="title">3D Twins Lite</div>

  <!-- STEP 1 -->
  <div id="step1" class="step active">

    <input id="urlInput" placeholder="Paste GLB URL..." />

    <button class="btn btn-secondary" onclick="loadAndNext()">
      Load Model
    </button>

  </div>

  <!-- STEP 2 -->
  <div id="step2" class="step">

    <div class="label">Background</div>
    <input id="bgInput" type="color" value="#0e0f13" />

    <div class="label">Auto rotate</div>
    <label style="display:flex;gap:8px;font-size:12px;">
      <input id="rotateInput" type="checkbox" checked />
      Enable rotation
    </label>

    <div class="navRow">
      <button class="navBtn" onclick="prevStep()">Back</button>
      <button class="navBtn" onclick="nextStep()">Next</button>
    </div>

  </div>

  <!-- STEP 3 -->
  <div id="step3" class="step">

    <button class="btn btn-primary" onclick="exportScene()">
      Publish Scene
    </button>

    <div id="linkBox">No scene generated yet</div>
    <div id="qrBox"></div>

    <div class="navRow">
      <button class="navBtn" onclick="prevStep()">Back</button>
    </div>

  </div>

</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/GLTFLoader.js"></script>

<!-- QR -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>

let scene, camera, renderer, controls, model;
let step = 1;

init();
animate();
checkURL();

/* ================= INIT ================= */

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#c2ceff");

  camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(2, 2, 3);

  renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("c"),
    antialias: true
  });

  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.2;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1));

  const d = new THREE.DirectionalLight(0xffffff, 0.8);
  d.position.set(5,10,5);
  scene.add(d);

  window.addEventListener("resize", onResize);

  /* LIVE EVENTS */
  bgInput.addEventListener("input", e => {
    applySceneStyle(e.target.value);
  });

  rotateInput.addEventListener("change", e => {
    controls.autoRotate = e.target.checked;
  });
}

/* ================= MODEL ================= */

function loadModel(url) {
  const loader = new THREE.GLTFLoader();

  if (model) scene.remove(model);

  loader.load(url, (gltf) => {
    model = gltf.scene;
    scene.add(model);

    const box = new THREE.Box3().setFromObject(model);
    model.position.sub(box.getCenter(new THREE.Vector3()));
  });
}

function loadAndNext() {
  const url = urlInput.value.trim();
  if (!url) return;

  loadModel(url);
  goStep(2);
}

/* ================= STEPS ================= */

function goStep(n) {
  step = n;
  document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
  document.getElementById("step"+n).classList.add("active");
}

function nextStep() {
  if (step < 3) goStep(step + 1);
}

function prevStep() {
  if (step > 1) goStep(step - 1);
}

/* ================= STYLE ================= */

function applySceneStyle(bg) {
  scene.background = new THREE.Color(bg);
  document.body.style.background = bg;
}

/* ================= EXPORT ================= */

function exportScene() {
  const url = urlInput.value.trim();

  const payload = {
    modelUrl: url,
    bg: bgInput.value,
    autoRotate: rotateInput.checked
  };

  const encoded = btoa(JSON.stringify(payload));
  const link = `${location.origin}${location.pathname}?scene=${encoded}`;

  linkBox.innerHTML = link;

  /* QR */
  qrBox.innerHTML = "";
  QRCode.toCanvas(link, { width: 140 }, function (err, canvas) {
    if (!err) qrBox.appendChild(canvas);
  });

  window.open(link, "_blank", "noopener,noreferrer");
}

/* ================= URL ================= */

function checkURL() {
  const p = new URLSearchParams(location.search).get("scene");
  if (!p) return;

  try {
    const d = JSON.parse(atob(p));

    document.getElementById("ui").style.display = "none";

    loadModel(d.modelUrl);

    if (d.bg) applySceneStyle(d.bg);
    if (d.autoRotate !== undefined) {
      rotateInput.checked = d.autoRotate;
      controls.autoRotate = d.autoRotate;
    }

  } catch (e) {}
}

/* ================= LOOP ================= */

function animate() {
  requestAnimationFrame(animate);
  if (controls) controls.update();
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

</script>

</body>
</html>
